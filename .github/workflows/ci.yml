name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Test + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned to the desk's Bun: its TOML parser has quirks the writer works around.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.18
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
